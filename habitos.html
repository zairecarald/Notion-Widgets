<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home · habits</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== PALETTE (same as the other widgets) ====== */
  :root{--bg:#191919;--panel:#202020;--line:#3a3a38;--text:#e8e6df;--muted:#8d8b84;--bar:#c4c2ac;--accent:#529cca;--warn:#d4907c;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{padding:12px 16px 18px;max-width:640px}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top h2{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}
  .pill{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;font:inherit;font-size:10px;letter-spacing:1px;padding:4px 11px;cursor:pointer}
  .pill:hover{border-color:var(--muted)}
  .gear{background:transparent;border:1px solid var(--line);border-radius:14px;width:30px;height:25px;display:grid;place-content:center;cursor:pointer;color:var(--muted)}
  .gear:hover{border-color:var(--muted);color:var(--text)}
  .gear.on{color:var(--accent);border-color:var(--accent)}
  .rt{display:flex;gap:8px;align-items:center}
  .ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-content:center;font:inherit;font-weight:800;font-size:14px;padding:0}
  .ibtn:hover{border-color:var(--muted)}
  .ibtn.on{color:var(--c0);border-color:var(--c0);background:color-mix(in srgb,var(--c0) 14%,var(--bg))}
  .icons{display:flex;gap:6px;flex-wrap:wrap}
  .ico svg{width:20px;height:20px}
  .pill.danger{color:var(--warn);border-color:var(--warn)}

  /* form */
  .form{display:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;margin-bottom:12px;gap:10px;flex-direction:column}
  .form.open{display:flex}
  .form label{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
  .form input[type=text],.form select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px;padding:7px 8px;outline:none;width:100%}
  .form input:focus,.form select:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px}
  .swatches{display:flex;gap:8px;padding:3px 0}
  .sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:var(--text)}
  .btns{display:flex;gap:8px}
  .btn{background:var(--text);color:var(--bg);border:0;border-radius:5px;font:inherit;font-weight:800;font-size:12px;padding:7px 14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}

  /* cards */
  #list{display:grid;gap:12px}
  .card{--c:#8e8bf0;border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:12px;
        background:color-mix(in srgb,var(--c) 7%,var(--panel));padding:14px}
  .head{display:flex;gap:12px;align-items:center}
  .ico{width:38px;height:38px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,var(--bg));color:var(--c);
       display:grid;place-content:center;font-weight:800;font-size:16px;flex:none;text-transform:uppercase}
  .meta{flex:1;min-width:0;cursor:pointer}
  .meta b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .check{width:46px;height:46px;border-radius:11px;border:1.5px solid var(--line);background:transparent;cursor:pointer;flex:none;display:grid;place-content:center;position:relative}
  .check:hover{border-color:var(--c)}
  .check.on{background:var(--c);border-color:var(--c)}
  .check.on::after{content:"";width:8px;height:16px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}

  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin:14px 0 10px;cursor:pointer}
  .cell{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--c) 13%,var(--bg))}
  .cell.on{background:var(--c)}
  .cell.today{outline:1.5px solid var(--text);outline-offset:0}
  .cell.fut{visibility:hidden}

  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;border-radius:8px;padding:4px 9px;background:color-mix(in srgb,var(--c) 15%,var(--bg));color:var(--c);font-weight:700;font-variant-numeric:tabular-nums}
  .chip.n{background:color-mix(in srgb,var(--text) 7%,var(--bg));color:var(--muted);font-weight:500}
  .chip.ok{color:var(--c)}

  /* detail */
  .detail{display:none;margin-top:14px;border-top:1px solid color-mix(in srgb,var(--c) 18%,var(--line));padding-top:14px}
  .detail.open{display:block}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cal-head b{font-size:12px;letter-spacing:1px}
  .nav{display:flex;gap:6px}
  .nav button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-size:10px;color:var(--muted);text-align:center;padding-bottom:4px;letter-spacing:1px}
  .day{aspect-ratio:1.25;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
  .day:hover{border-color:var(--line)}
  .day.out{color:#55534e}
  .day.on{background:color-mix(in srgb,var(--c) 32%,var(--bg));font-weight:700}
  .day.today{border-color:var(--c)}
  .day.fut{color:#55534e;cursor:default}
  .day.fut:hover{border-color:transparent}
  .tools{display:flex;gap:8px;margin-top:14px}
  .hint{font-size:10px;color:var(--muted);margin-top:10px}

  .empty{font-size:12px;color:var(--muted);padding:18px 4px}
  .foot{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .backup{display:none;margin-top:10px;flex-direction:column;gap:8px}
  .backup.open{display:flex}
  .backup textarea{height:90px;resize:vertical;font-size:10px}
  #warn{display:none;font-size:10px;color:var(--warn);margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="top"><h2>HABITS</h2><div class="rt"><button class="gear" id="gear" title="settings (backup)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button><button class="pill" id="new">+ NEW</button></div></div>

  <form class="form" id="form" autocomplete="off">
    <div class="row">
      <div style="flex:2"><label>NAME</label><input type="text" id="f-name" maxlength="30" placeholder="e.g. Italian"></div>
      <div><label>WEEKLY GOAL</label>
        <select id="f-goal"></select></div>
    </div>
    <div><label>DESCRIPTION (optional)</label><input type="text" id="f-desc" maxlength="70" placeholder="e.g. At least 15 minutes"></div>
    <div><label>ICON</label><div class="icons" id="f-ic"></div></div>
    <div><label>COLOR</label><div class="swatches" id="f-sw"></div></div>
    <div class="btns"><button type="submit" class="btn" id="f-save">SAVE</button><button type="button" class="btn ghost" id="f-cancel">CANCEL</button></div>
  </form>

  <div id="list"></div>

  <div class="backup" id="backup">
    <div class="hint" style="margin:0;letter-spacing:1.5px">SETTINGS / BACKUP</div>
    <div class="hint">Copy this text and keep it wherever you like. To restore your data or move it to another browser, paste it here and press RESTORE.</div>
    <textarea id="bk-text" spellcheck="false"></textarea>
    <div class="btns"><button class="btn ghost" id="bk-restore">RESTORE</button><span class="hint" id="bk-msg" style="align-self:center;margin:0"></span></div>
  </div>
  <div id="warn">this browser doesn't allow saving data here: anything you mark will be lost on reload</div>
</main>

<script>
/* ===== CONFIG ===== */
/* Only two colours for now, to test the palette. Add more here later. */
const COLORS = { rose:"#d4907c", cyan:"#5cc4dc" };
const LEGACY_COLORS = { violeta:"cyan", ambar:"rose", cian:"cyan", verde:"cyan", rosa:"rose", violet:"cyan", amber:"rose", green:"cyan", beige:"rose" };  // older names / removed colours
/* Icons: simple 24x24 line drawings. Add your own by adding a line (name: svg inner markup). */
const ICONS = {
  book:   '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M6.5 17a2.5 2.5 0 0 0 0 4H20v-4"/>',
  cap:    '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
  pen:    '<path d="M17 3l4 4L7 21H3v-4z"/>',
  chat:   '<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6A8 8 0 1 1 21 12z"/>',
  globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  code:   '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
  music:  '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  dumbbell:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  heart:  '<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 22l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  drop:   '<path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7z"/>',
  moon:   '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  star:   '<path d="M12 2l3 6.5 7 1-5 5 1.2 7L12 18l-6.2 3.5L7 14.5l-5-5 7-1z"/>'
};
const svgIcon = k => { const d = document.createElementNS("http://www.w3.org/2000/svg", "svg"); d.setAttribute("viewBox", "0 0 24 24"); d.setAttribute("fill", "none"); d.setAttribute("stroke", "currentColor"); d.setAttribute("stroke-width", "2"); d.setAttribute("stroke-linecap", "round"); d.setAttribute("stroke-linejoin", "round"); d.innerHTML = ICONS[k]; return d; };
const WEEKS = 26;                 // weeks shown in the grid
const STORE = "home-habits";
const SEED = [
  { name:"Languages", desc:"Practice for at least 15 minutes", goal:5, color:"cyan", icon:"chat" },
  { name:"Reading",   desc:"Read for a while every day",       goal:7, color:"rose", icon:"book" },
  { name:"Practice",  desc:"A skill I want to improve",        goal:3, color:"cyan", icon:"target" }
];
// untouched Spanish starter habits from the first version get translated automatically
const SEED_ES = { "Idiomas|Practicar al menos 15 minutos":0, "Lectura|Leer un rato cada día":1, "Práctica|Una skill que quiera mejorar":2 };

/* ===== utilities ===== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => addDays(dayStart(d), -((d.getDay() + 6) % 7));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DOW = ["M","T","W","T","F","S","S"];
let storageOK = true;
function rd(k){ try { return localStorage.getItem(k); } catch(e){ storageOK = false; return null; } }
function wr(k, v){ try { localStorage.setItem(k, v); } catch(e){ storageOK = false; $("warn").style.display = "block"; } }

function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    if (k === "class") e.className = props[k];
    else if (k.startsWith("on")) e[k] = props[k];
    else if (k === "text") e.textContent = props[k];
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => c && e.appendChild(c));
  return e;
}

/* ===== data ===== */
let habits = [];
function load(){
  let raw = rd(STORE), data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch(e){}
  if (data && Array.isArray(data.habits)){ habits = data.habits; if (migrate()) save(); }
  else if (!rd(STORE + "-seeded")){
    habits = SEED.map(s => ({ id: uid(), name: s.name, desc: s.desc, goal: s.goal, color: s.color, icon: s.icon, days: {} }));
    wr(STORE + "-seeded", "1"); save();
  }
}
function migrate(){
  let changed = false;
  habits.forEach(h => {
    if (!COLORS[h.color]){ h.color = LEGACY_COLORS[h.color] || "rose"; changed = true; }
    const si = SEED_ES[h.name + "|" + h.desc];
    if (si !== undefined){ h.name = SEED[si].name; h.desc = SEED[si].desc; changed = true; }
  });
  return changed;
}
function save(){ wr(STORE, JSON.stringify({ v: 1, habits })); }
try { localStorage.setItem("home-test", "1"); localStorage.removeItem("home-test"); } catch(e){ storageOK = false; $("warn").style.display = "block"; }

const today = () => dayStart(new Date());
function streak(h){
  let d = today();
  if (!h.days[keyOf(d)]) d = addDays(d, -1);
  let n = 0;
  while (h.days[keyOf(d)]){ n++; d = addDays(d, -1); }
  return n;
}
function weekCount(h){
  const m = mondayOf(new Date()); let n = 0;
  for (let i = 0; i < 7; i++) if (h.days[keyOf(addDays(m, i))]) n++;
  return n;
}
function total(h){ return Object.keys(h.days).length; }

/* ===== UI state ===== */
let openId = null, cal = {}, editingId = null;
function monthOf(h){
  if (!cal[h.id]){ const n = new Date(); cal[h.id] = { y: n.getFullYear(), m: n.getMonth() }; }
  return cal[h.id];
}

/* ===== render ===== */
function render(){
  const list = $("list"); list.textContent = "";
  if (!habits.length){
    list.appendChild(el("div", { class: "empty", text: "No habits yet. Press + NEW to create the first one." }));
    return;
  }
  habits.forEach(h => list.appendChild(card(h)));
}

function iconEl(h){
  if (ICONS[h.icon]) return el("div", { class: "ico" }, svgIcon(h.icon));
  return el("div", { class: "ico", text: (h.name || "?").trim().charAt(0) });
}
function card(h){
  const c = el("div", { class: "card" });
  c.style.setProperty("--c", COLORS[h.color] || COLORS.rose);
  const tk = keyOf(today());

  const check = el("button", { class: "check" + (h.days[tk] ? " on" : ""), title: h.days[tk] ? "unmark today" : "mark today as done",
    onclick: () => { toggle(h, tk); } });
  const meta = el("div", { class: "meta", onclick: () => { openId = openId === h.id ? null : h.id; render(); } },
    el("b", { text: h.name }), el("span", { text: h.desc || " " }));
  c.appendChild(el("div", { class: "head" }, iconEl(h), meta, check));

  // contribution-style grid: columns = weeks, rows = Monday to Sunday
  const heat = el("div", { class: "heat", onclick: () => { openId = openId === h.id ? null : h.id; render(); } });
  heat.style.gridTemplateColumns = "repeat(" + WEEKS + ",1fr)";
  const start = addDays(mondayOf(new Date()), -(WEEKS - 1) * 7), t = today();
  for (let w = 0; w < WEEKS; w++) for (let r = 0; r < 7; r++){
    const d = addDays(start, w * 7 + r), k = keyOf(d);
    let cls = "cell";
    if (d > t) cls += " fut"; else { if (h.days[k]) cls += " on"; if (k === tk) cls += " today"; }
    heat.appendChild(el("div", { class: cls, title: k }));
  }
  c.appendChild(heat);

  const wk = weekCount(h), st = streak(h);
  c.appendChild(el("div", { class: "stats" },
    el("span", { class: "chip", text: "streak " + st }),
    el("span", { class: "chip n" + (wk >= h.goal ? " ok" : ""), text: wk + " of " + h.goal + " this week" }),
    el("span", { class: "chip n", text: total(h) + " total" })
  ));

  const det = el("div", { class: "detail" + (openId === h.id ? " open" : "") });
  if (openId === h.id) fillDetail(det, h);
  c.appendChild(det);
  return c;
}

function fillDetail(det, h){
  const cm = monthOf(h), first = new Date(cm.y, cm.m, 1), t = today(), tk = keyOf(t);
  det.appendChild(el("div", { class: "cal-head" },
    el("b", { text: MONTHS[cm.m] + " " + cm.y }),
    el("div", { class: "nav" },
      el("button", { text: "<", title: "previous month", onclick: () => { cm.m--; if (cm.m < 0){ cm.m = 11; cm.y--; } render(); } }),
      el("button", { text: ">", title: "next month", onclick: () => { cm.m++; if (cm.m > 11){ cm.m = 0; cm.y++; } render(); } })
    )));
  const grid = el("div", { class: "cal" });
  DOW.forEach(d => grid.appendChild(el("div", { class: "dow", text: d })));
  const gStart = addDays(first, -((first.getDay() + 6) % 7));
  for (let i = 0; i < 42; i++){
    const d = addDays(gStart, i);
    if (i >= 35 && d.getMonth() !== cm.m) break;
    const k = keyOf(d), fut = d > t;
    let cls = "day";
    if (d.getMonth() !== cm.m) cls += " out";
    if (h.days[k]) cls += " on";
    if (k === tk) cls += " today";
    if (fut) cls += " fut";
    grid.appendChild(el("button", { class: cls, text: String(d.getDate()), onclick: fut ? null : () => toggle(h, k) }));
  }
  det.appendChild(grid);
  det.appendChild(el("div", { class: "hint", text: "Click a day to mark or unmark it." }));

  let confirmDel = false;
  const del = el("button", { class: "pill danger", text: "DELETE",
    onclick: () => {
      if (!confirmDel){ confirmDel = true; del.textContent = "SURE? CLICK AGAIN"; return; }
      habits = habits.filter(o => o.id !== h.id); openId = null; save(); render();
    } });
  det.appendChild(el("div", { class: "tools" },
    el("button", { class: "pill", text: "EDIT", onclick: () => openForm(h) }), del));
}

function toggle(h, k){
  if (h.days[k]) delete h.days[k]; else h.days[k] = 1;
  save(); render();
}

/* ===== form ===== */
for (let i = 1; i <= 7; i++) $("f-goal").appendChild(el("option", { value: i, text: i === 7 ? "7 (every day)" : String(i) }));
let formColor = "rose", formIcon = "letter";
function drawSwatches(){
  const box = $("f-sw"); box.textContent = "";
  Object.keys(COLORS).forEach(n => {
    const b = el("button", { type: "button", class: "sw" + (n === formColor ? " on" : ""), title: n,
      onclick: () => { formColor = n; drawSwatches(); drawIcons(); } });
    b.style.background = COLORS[n]; box.appendChild(b);
  });
}
function drawIcons(){
  const box = $("f-ic"); box.textContent = "";
  box.style.setProperty("--c0", COLORS[formColor] || COLORS.rose);
  box.appendChild(el("button", { type: "button", class: "ibtn" + (formIcon === "letter" ? " on" : ""), title: "first letter of the name", text: "A", onclick: () => { formIcon = "letter"; drawIcons(); } }));
  Object.keys(ICONS).forEach(k => {
    const b = el("button", { type: "button", class: "ibtn" + (formIcon === k ? " on" : ""), title: k, onclick: () => { formIcon = k; drawIcons(); } });
    const sv = svgIcon(k); sv.setAttribute("width", "18"); sv.setAttribute("height", "18"); b.appendChild(sv); box.appendChild(b);
  });
}
function openForm(h){
  editingId = h ? h.id : null;
  $("f-name").value = h ? h.name : "";
  $("f-desc").value = h ? h.desc : "";
  $("f-goal").value = h ? h.goal : 5;
  formColor = h ? (COLORS[h.color] ? h.color : "rose") : Object.keys(COLORS)[habits.length % Object.keys(COLORS).length];
  formIcon = h && ICONS[h.icon] ? h.icon : "letter";
  $("f-save").textContent = h ? "UPDATE" : "SAVE";
  drawSwatches(); drawIcons();
  $("form").classList.add("open");
  $("f-name").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeForm(){ $("form").classList.remove("open"); editingId = null; }
$("new").onclick = () => $("form").classList.contains("open") ? closeForm() : openForm(null);
$("f-cancel").onclick = closeForm;
$("form").onsubmit = e => {
  e.preventDefault();
  const name = $("f-name").value.trim();
  if (!name){ $("f-name").focus(); return; }
  const data = { name, desc: $("f-desc").value.trim(), goal: +$("f-goal").value, color: formColor, icon: formIcon };
  if (editingId){ Object.assign(habits.find(h => h.id === editingId), data); }
  else { const h = { id: uid(), days: {}, ...data }; habits.push(h); openId = null; }
  save(); closeForm(); render();
};

/* ===== backup ===== */
$("gear").onclick = () => {
  const b = $("backup"), open = !b.classList.contains("open");
  b.classList.toggle("open", open); $("gear").classList.toggle("on", open);
  if (open){ $("bk-text").value = JSON.stringify({ v: 1, habits }); $("bk-msg").textContent = ""; }
};
$("bk-restore").onclick = () => {
  try {
    const d = JSON.parse($("bk-text").value);
    if (!d || !Array.isArray(d.habits)) throw new Error("formato");
    habits = d.habits.map(h => ({ id: h.id || uid(), name: String(h.name || "Habit"), desc: String(h.desc || ""),
      goal: Math.min(7, Math.max(1, +h.goal || 5)), icon: ICONS[h.icon] ? h.icon : "letter", color: COLORS[h.color] ? h.color : (LEGACY_COLORS[h.color] || "rose"), days: h.days && typeof h.days === "object" ? h.days : {} }));
    save(); render(); $("bk-msg").textContent = "restored";
  } catch(e){ $("bk-msg").textContent = "invalid text, nothing was changed"; }
};

/* ===== startup ===== */
load(); render();
window.addEventListener("storage", e => { if (e.key === STORE){ load(); render(); } });
// refresh when the day changes (in case the tab stays open)
let lastDay = keyOf(today());
setInterval(() => { const k = keyOf(today()); if (k !== lastDay){ lastDay = k; render(); } }, 60000);
</script>
</body>
</html>
