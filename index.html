<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home · header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== PALETTE (change it here) ====== */
  :root{
    --bg:#191919;        /* background, same as Notion dark mode */
    --panel:#202020;
    --line:#3a3a38;
    --text:#e8e6df;
    --muted:#8d8b84;
    --bar:#c4c2ac;       /* bar fill */
    --accent:#529cca;    /* accent blue */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{max-width:880px;margin:0;padding:20px 16px 28px;position:relative}
  .gear{position:absolute;top:12px;right:16px;background:transparent;border:1px solid var(--line);border-radius:14px;width:30px;height:25px;display:grid;place-content:center;cursor:pointer;color:var(--muted);opacity:.6}
  .gear:hover{border-color:var(--muted);color:var(--text);opacity:1}
  #ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:20px 16px;flex-direction:column;gap:14px}
  #ov.open{display:flex}
  #ov h2{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}
  .ovh{display:flex;justify-content:space-between;align-items:center}
  .pill{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;font:inherit;font-size:10px;letter-spacing:1px;padding:4px 11px;cursor:pointer}
  .pill:hover{border-color:var(--muted)}
  .srow{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:1.5px;color:var(--muted)}
  .sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:var(--text)}

  #greet{font-weight:800;font-size:clamp(22px,4.6vw,38px);line-height:1.2;letter-spacing:-.5px;cursor:pointer;
         padding-left:14px;border-left:3px solid var(--text);margin-bottom:26px}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:26px}
  @media(max-width:640px){.row{grid-template-columns:1fr;gap:20px}}

  .clock{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .unit{display:flex;flex-direction:column;align-items:center}
  .unit b{font-size:clamp(34px,7vw,52px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .unit small{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:6px;font-weight:500}
  .date{width:100%;color:var(--muted);font-size:13px;margin-top:2px;text-transform:lowercase}

  .sun{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px 16px}
  .sun-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .sun-top span{color:var(--muted);font-size:11px;letter-spacing:1.5px}
  select{background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:4px;
         font:inherit;font-size:12px;padding:3px 6px;font-weight:700;cursor:pointer}
  .sun-times{display:flex;gap:26px;margin-bottom:10px}
  .sun-times div{display:flex;flex-direction:column}
  .sun-times small{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
  .sun-times b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  #sunline{color:var(--muted);font-size:12px}
  .daybar{height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);margin:10px 0 8px;overflow:hidden}
  .daybar i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}

  .bars{display:grid;gap:10px;margin-bottom:24px}
  .bar{display:grid;grid-template-columns:78px 1fr 118px;gap:12px;align-items:center;font-size:12px}
  .bar label{color:var(--muted);letter-spacing:1px}
  .track{height:16px;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:transparent}
  .track i{display:block;height:100%;width:0;background:var(--bar);transition:width 1s linear}
  .bar span{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  @media(max-width:480px){.bar{grid-template-columns:56px 1fr 120px;gap:8px;font-size:10px}}

  .age{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:5px}
  .age .l{color:var(--muted);font-size:10px;letter-spacing:1.5px}
  .age b{font-size:clamp(15px,3vw,20px);font-weight:700;font-variant-numeric:tabular-nums}
  .age p{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <button class="gear" id="gear" title="settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <div id="ov"><div class="ovh"><h2>SETTINGS</h2><button class="pill" id="close">CLOSE</button></div><div class="srow"><span>COLOR</span><div id="colsw" style="display:flex;gap:8px"></div></div></div>
  <h1 id="greet" title="click for another greeting"></h1>

  <section class="row">
    <div class="clock">
      <div class="unit"><b id="hh">00</b><small>HOURS</small></div>
      <div class="unit"><b id="mm">00</b><small>MIN</small></div>
      <div class="unit"><b id="ss">00</b><small>SEC</small></div>
      <div class="date" id="date"></div>
    </div>

    <div class="sun">
      <div class="sun-top"><span>SUN IN</span><select id="place"></select></div>
      <div class="sun-times">
        <div><small>SUNRISE</small><b id="rise">--:--</b></div>
        <div><small>SUNSET</small><b id="set">--:--</b></div>
        <div><small>DAYLIGHT</small><b id="len">--</b></div>
      </div>
      <div class="daybar"><i id="sunprog"></i></div>
      <div id="sunline"></div>
    </div>
  </section>

  <section class="bars">
    <div class="bar"><label>DAY</label><div class="track"><i id="b-day"></i></div><span id="t-day"></span></div>
    <div class="bar"><label>WEEK</label><div class="track"><i id="b-week"></i></div><span id="t-week"></span></div>
    <div class="bar"><label>MONTH</label><div class="track"><i id="b-month"></i></div><span id="t-month"></span></div>
    <div class="bar"><label>YEAR</label><div class="track"><i id="b-year"></i></div><span id="t-year"></span></div>
  </section>

  <section class="age">
    <div class="l">AGE</div>
    <b id="age1"></b>
    <p id="age2"></p>
    <p id="age3"></p>
  </section>
</main>

<script>
/* =====================================================================
   CONFIG: the only part you will normally need to touch
   ===================================================================== */
const CONFIG = {
  name: "Zaire",
  birth: [2006, 9, 27],            // [year, month, day]
  defaultPlace: "Sevilla",
  places: {                         // name: [latitude, longitude]
    "Sevilla":   [37.3891, -5.9845],
    "Bollullos": [37.3386, -6.5400],
    "Barcelona": [41.3874,  2.1686],
    "Cubelles":  [41.2083,  1.6742]
  }
};

/* Greetings by time of day. {name} is replaced with your name.
   Add or remove phrases freely. */
const GREETINGS = {
  lateNight: [   // 00:00 - 05:59
    "The moon’s your copilot, {name}",
    "Still up, {name}? The night shift suits you",
    "Midnight thoughts hit different, {name}",
    "The stars are on your payroll tonight, {name}",
    "Quiet hours, loud ideas, {name}",
    "The world is asleep. You’re the main character, {name}",
    "Even the moon is yawning, {name}",
    "Night owl mode: activated, {name}",
    "The dark is just the sky showing its work, {name}",
    "Somewhere a clock is whispering secrets, {name}",
    "The city dreams out loud and you’re listening, {name}",
    "Insomnia is just the universe leaving the door open, {name}",
    "The streetlights are keeping your secrets, {name}",
    "Wide awake in the velvet hours, {name}",
    "Constellations are clocking in for the night shift, {name}",
    "The hour of ghosts and good ideas, {name}",
    "Silence has a frequency, and you’re tuned to it, {name}",
    "The night is a cathedral and you’re its only candle, {name}",
    "Three a.m. philosophers, assemble. Hello, {name}",
    "Moonlight is the cheapest lamp, {name}",
    "The sky forgot to turn off the stars, {name}",
    "Dawn is still packing its bags, {name}",
    "Between yesterday and tomorrow there is you, {name}",
    "Even the shadows are tiptoeing around you, {name}"
  ],
  morning: [   // 06:00 - 11:59
    "Rise and conquer, {name}",
    "The sun clocked in early for you, {name}",
    "Fresh day, fresh save file, {name}",
    "Good morning, {name}. The world is mildly ready",
    "Coffee first, destiny second, {name}",
    "New quest unlocked, {name}",
    "The day is a blank page, {name}",
    "Wake up and be mildly legendary, {name}",
    "The horizon just poured you a cup of gold, {name}",
    "Dawn spilled its paint across the sky for you, {name}",
    "A brand new day, still wrapped, {name}",
    "The morning hums and you are its melody, {name}",
    "Light climbs the walls to say hello, {name}",
    "Today is a rumor of greatness, {name}",
    "The rooster is overrated, the sunrise is for you, {name}",
    "Open the curtains, open the chapter, {name}",
    "The world rebooted overnight. You’re welcome, {name}",
    "Sunrise doesn’t ask permission, neither should you, {name}",
    "Morning dew, morning crew, {name}",
    "The sky is blushing at how good today looks, {name}",
    "Yesterday is a closed book. Page one awaits, {name}",
    "The day yawns, stretches, and looks at you, {name}",
    "Dawn light, quiet courage, {name}",
    "Another sunrise, another excuse to shine, {name}",
    "Today’s forecast: ambition with scattered brilliance, {name}"
  ],
  midday: [   // 12:00 - 15:59
    "High noon, {name}. Make it count",
    "The sun is at its peak and so are you, {name}",
    "Refuel, {name}. Heroes eat lunch too",
    "Halfway through the day, {name}. Keep the momentum",
    "Lunch break loading, {name}",
    "Main quest continues, {name}",
    "Midday already? Time flies when you’re winning, {name}",
    "The sun stands directly above your plans, {name}",
    "Shadows are shortest when you stand tallest, {name}",
    "The day balances on the tip of noon, {name}",
    "Gold light, sharp focus, {name}",
    "The clock hands are shaking yours, {name}",
    "Noon sings and the afternoon is listening, {name}",
    "The sky is wide open and so are your options, {name}",
    "Peak daylight, peak potential, {name}",
    "Half a day behind you, half a legend ahead, {name}",
    "The sun is showing off again, {name}",
    "Bright hours are for bold moves, {name}",
    "Even the shadows are taking a lunch break, {name}",
    "Heat shimmers, ideas simmer, {name}",
    "The afternoon is a runway, {name}",
    "Midday has the whole sky as its stage, {name}",
    "Keep the engine humming, {name}"
  ],
  evening: [   // 16:00 - 20:59
    "Golden hour has your name on it, {name}",
    "Still plenty of daylight to use, {name}",
    "The sun is leaning on the horizon, {name}",
    "Sidequests are optional, {name}. The vibes are not",
    "The day is winding down, you’re not, {name}",
    "Soft light, sharp mind, {name}",
    "Evening, {name}. One more good move?",
    "The sky is melting into honey and rose, {name}",
    "Amber light on everything you’ve built today, {name}",
    "The sun is taking a slow, dramatic bow, {name}",
    "Dusk paints in warm colors, {name}",
    "Long shadows, longer ambitions, {name}",
    "The horizon is blushing, {name}",
    "The day exhales and you may as well, {name}",
    "Twilight is knocking, bring your best ideas, {name}",
    "The light is leaving gracefully, take notes, {name}",
    "Evening spills over the rooftops, {name}",
    "A sky like a half-finished poem, {name}",
    "Sunset is the day’s encore, {name}",
    "The clouds are dressed in copper tonight, {name}",
    "Daylight is a rental, use it wisely, {name}",
    "Closing arguments of the sun, {name}",
    "Violet edges on the afternoon, {name}"
  ],
  night: [   // 21:00 - 23:59
    "Time to power down the engines, {name}",
    "The night is young and so are you, {name}",
    "Lights low, mind high, {name}",
    "Welcome back to the calm, {name}",
    "Close the day like a legend, {name}",
    "The moon is clocking in, {name}",
    "Good night soon, {name}. You earned it",
    "The stars are unrolling their carpet, {name}",
    "The sky changed into its velvet coat, {name}",
    "Night arrives wearing constellations, {name}",
    "The day folds itself away, {name}",
    "Fireflies of thought are waking up, {name}",
    "Dim the world, brighten the mind, {name}",
    "The moon is rehearsing its silver speech, {name}",
    "A blanket of dark, stitched with stars, {name}",
    "Lamps on, worries off, {name}",
    "The city turns its lights into constellations, {name}",
    "Let the evening hum its lullaby, {name}",
    "You carried the whole day. Set it down, {name}",
    "Nightfall: the world’s softest notification, {name}",
    "Somewhere the sunset is still lingering, {name}",
    "The dark is gentle tonight, {name}",
    "Every star is a tiny reason to rest, {name}",
    "Tonight belongs to the quiet ones, {name}"
  ]
};

/* ============================ SUN (SunCalc) ============================ */
// SUN-START
const RAD = Math.PI / 180, DAY_MS = 864e5, J1970 = 2440588, J2000 = 2451545, OBLIQ = RAD * 23.4397, J0 = 0.0009;
const toJulian = d => d.valueOf() / DAY_MS - 0.5 + J1970;
const fromJulian = j => new Date((j + 0.5 - J1970) * DAY_MS);
const toDays = d => toJulian(d) - J2000;
const solarMeanAnomaly = d => RAD * (357.5291 + 0.98560028 * d);
function eclipticLongitude(M){
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  return M + C + RAD * 102.9372 + Math.PI;
}
const declination = L => Math.asin(Math.sin(OBLIQ) * Math.sin(L));
const julianCycle = (d, lw) => Math.round(d - J0 - lw / (2 * Math.PI));
const approxTransit = (Ht, lw, n) => J0 + (Ht + lw) / (2 * Math.PI) + n;
const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
const hourAngle = (h, phi, d) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d)));
function sunTimes(date, lat, lng){
  const lw = RAD * -lng, phi = RAD * lat, d = toDays(date), n = julianCycle(d, lw),
        ds = approxTransit(0, lw, n), M = solarMeanAnomaly(ds), L = eclipticLongitude(M),
        dec = declination(L), Jnoon = solarTransitJ(ds, M, L);
  const w = hourAngle(-0.833 * RAD, phi, dec);
  const Jset = solarTransitJ(approxTransit(w, lw, n), M, L);
  const Jrise = Jnoon - (Jset - Jnoon);
  return { rise: fromJulian(Jrise), set: fromJulian(Jset) };
}
// SUN-END

/* ============================ UTILITIES ============================ */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const nf = new Intl.NumberFormat("en-US");
const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
function dur(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  return Math.floor(m / 60) + "h " + pad(m % 60) + "m";
}
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ============================ COLOR (settings) ============================ */
const ICOL = { default: null, rose: "#d4907c", cyan: "#5cc4dc" };
function applyColor(){
  const n = safeGet("index-color") || "default", hex = ICOL[n] || null, r = document.documentElement.style;
  r.setProperty("--bar", hex || "#c4c2ac"); r.setProperty("--accent", hex || "#529cca");
  const box = $("colsw"); box.textContent = "";
  Object.keys(ICOL).forEach(k => {
    const b = document.createElement("button"); b.type = "button"; b.className = "sw" + (k === n ? " on" : ""); b.title = k;
    b.style.background = ICOL[k] || "linear-gradient(135deg,#529cca 50%,#c4c2ac 50%)";
    b.onclick = () => { safeSet("index-color", k); applyColor(); };
    box.appendChild(b);
  });
}
$("gear").onclick = () => $("ov").classList.add("open");
$("close").onclick = () => $("ov").classList.remove("open");
applyColor();

/* ============================ GREETING ============================ */
function slot(h){
  return h < 6 ? "lateNight" : h < 12 ? "morning" : h < 16 ? "midday" : h < 21 ? "evening" : "night";
}
let greetOffset = 0;
function showGreeting(){
  const now = new Date(), list = GREETINGS[slot(now.getHours())];
  // Same phrase for the whole hour; it changes on the next hour or on click
  const seed = now.getFullYear() * 1000 + (now.getMonth() * 31 + now.getDate()) * 24 + now.getHours();
  const i = (seed * 7 + greetOffset) % list.length;
  $("greet").textContent = list[i].replace("{name}", CONFIG.name);
}
$("greet").addEventListener("click", () => { greetOffset++; showGreeting(); });

/* ============================ SUN UI ============================ */
const sel = $("place");
Object.keys(CONFIG.places).forEach(p => {
  const o = document.createElement("option"); o.value = o.textContent = p; sel.appendChild(o);
});
const qp = new URLSearchParams(location.search).get("loc");
sel.value = (qp && CONFIG.places[qp]) ? qp : (CONFIG.places[safeGet("place")] ? safeGet("place") : CONFIG.defaultPlace);
sel.addEventListener("change", () => { safeSet("place", sel.value); renderSun(); });

function renderSun(){
  const [lat, lng] = CONFIG.places[sel.value], now = new Date();
  const noon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
  const t = sunTimes(noon, lat, lng);
  $("rise").textContent = hm(t.rise);
  $("set").textContent = hm(t.set);
  $("len").textContent = dur(t.set - t.rise);
  let line, prog;
  if (now < t.rise){
    line = "sunrise in " + dur(t.rise - now); prog = 0;
  } else if (now < t.set){
    line = "sunset in " + dur(t.set - now); prog = (now - t.rise) / (t.set - t.rise);
  } else {
    const tm = sunTimes(new Date(noon.getTime() + DAY_MS), lat, lng);
    line = "night · sunrise at " + hm(tm.rise); prog = 1;
  }
  $("sunline").textContent = line;
  $("sunprog").style.width = (prog * 100).toFixed(1) + "%";
}

/* ============================ CLOCK, BARS, AGE ============================ */
const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const birth = new Date(CONFIG.birth[0], CONFIG.birth[1] - 1, CONFIG.birth[2]);

function setBar(key, p, extra){
  p = Math.min(1, Math.max(0, p));
  $("b-" + key).style.width = (p * 100).toFixed(2) + "%";
  $("t-" + key).textContent = Math.floor(p * 100) + "%" + (extra ? " · " + extra : "");
}
function ageParts(b, n){
  let y = n.getFullYear() - b.getFullYear(), m = n.getMonth() - b.getMonth(), d = n.getDate() - b.getDate();
  if (d < 0){ m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (m < 0){ y--; m += 12; }
  return { y, m, d };
}
const plural = (n, s, p) => n + " " + (n === 1 ? s : p);

function tick(){
  const n = new Date();
  $("hh").textContent = pad(n.getHours());
  $("mm").textContent = pad(n.getMinutes());
  $("ss").textContent = pad(n.getSeconds());
  $("date").textContent = DAYS[n.getDay()] + " · " + MONTHS[n.getMonth()] + " " + n.getDate() + ", " + n.getFullYear();

  const y = n.getFullYear(), m = n.getMonth();
  const dayStart = new Date(y, m, n.getDate());
  const dayEnd = new Date(y, m, n.getDate() + 1);
  const dow = (n.getDay() + 6) % 7;                       // monday = 0
  const wkStart = new Date(y, m, n.getDate() - dow), wkEnd = new Date(y, m, n.getDate() - dow + 7);
  const moStart = new Date(y, m, 1), moEnd = new Date(y, m + 1, 1);
  const yrStart = new Date(y, 0, 1), yrEnd = new Date(y + 1, 0, 1);
  const frac = (a, b) => (n - a) / (b - a);
  const daysLeft = (end) => Math.ceil((end - n) / DAY_MS);

  setBar("day", frac(dayStart, dayEnd), dur(dayEnd - n));
  setBar("week", frac(wkStart, wkEnd), daysLeft(wkEnd) + "d");
  setBar("month", frac(moStart, moEnd), daysLeft(moEnd) + "d");
  setBar("year", frac(yrStart, yrEnd), daysLeft(yrEnd) + "d");

  const a = ageParts(birth, n);
  const totalDays = Math.floor((n - birth) / DAY_MS);
  $("age1").textContent = plural(a.y, "year", "years") + " · " + plural(a.m, "month", "months") + " · " + plural(a.d, "day", "days");
  $("age2").textContent = nf.format(a.y * 12 + a.m) + " months · " + nf.format(Math.floor(totalDays / 7)) + " weeks · " + nf.format(totalDays) + " days";
  let next = new Date(y, birth.getMonth(), birth.getDate());
  if (next < dayStart) next = new Date(y + 1, birth.getMonth(), birth.getDate());
  const toNext = Math.round((next - dayStart) / DAY_MS);
  $("age3").textContent = toNext === 0 ? "today is your birthday" : "next birthday in " + toNext + " days";
}

let lastMinute = -1, lastHour = -1;
function loop(){
  tick();
  const n = new Date();
  if (n.getMinutes() !== lastMinute){ lastMinute = n.getMinutes(); renderSun(); }
  if (n.getHours() !== lastHour){ lastHour = n.getHours(); greetOffset = 0; showGreeting(); }
}
loop();
setInterval(loop, 1000);
</script>
</body>
</html>
