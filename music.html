<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home · música</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--panel:#202020;--line:#3a3a38;--text:#e8e6df;--muted:#8d8b84;--bar:#c4c2ac;--accent:#529cca}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{max-width:520px;margin:0;padding:12px 16px}
  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  #ytwrap{width:200px;height:200px;border-radius:6px;overflow:hidden;background:#000;flex:none}
  .info{flex:1;min-width:210px;display:flex;flex-direction:column;gap:9px}
  select{background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer;width:100%}
  #title{font-weight:700;font-size:14px;line-height:1.3;min-height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #status{font-size:11px;color:var(--muted);min-height:14px}
  .seek{height:8px;border:1.5px solid var(--line);border-radius:5px;cursor:pointer;overflow:hidden}
  .seek i{display:block;height:100%;width:0;background:var(--bar)}
  .times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
  .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ctrl button{font:inherit;font-size:12px;cursor:pointer;border-radius:5px;padding:6px 10px;background:transparent;color:var(--text);border:1px solid var(--line)}
  .ctrl button.main{background:var(--text);color:var(--bg);border:0;font-weight:800;min-width:78px}
  .ctrl button.on{color:var(--accent);border-color:var(--accent)}
  .vol{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);letter-spacing:1px}
  input[type=range]{flex:1;accent-color:var(--bar)}
</style>
</head>
<body>
<main>
  <div class="card">
    <div id="ytwrap"><div id="yt"></div></div>
    <div class="info">
      <select id="pl"></select>
      <div id="title">—</div>
      <div id="status">cargando…</div>
      <div class="seek" id="seek"><i id="fill"></i></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="ctrl">
        <button id="prev" title="anterior">&lt;&lt;</button>
        <button id="play" class="main">PLAY</button>
        <button id="next" title="siguiente">&gt;&gt;</button>
        <button id="shuf" title="aleatorio">SHUF</button>
        <button id="loop" class="on" title="repetir playlist">LOOP</button>
      </div>
      <div class="vol"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="60"></div>
    </div>
  </div>
</main>

<script>
/* ====================================================================
   TUS PLAYLISTS: pega aquí el enlace completo de YouTube / YouTube Music.
   La playlist debe ser pública o "no listada".
   Añade más líneas para tener varias en el desplegable.
   ==================================================================== */
const PLAYLISTS = [
  { name: "prueba", url: "https://music.youtube.com/playlist?list=PLcyp8AN81_IA" }
];

/* ============================ CÓDIGO ============================ */
const $ = id => document.getElementById(id);
const listId = u => { const m = u.match(/[?&]list=([^&]+)/); return m ? m[1] : u.trim(); };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

PLAYLISTS.forEach((p, i) => { const o = document.createElement("option"); o.value = i; o.textContent = p.name; $("pl").appendChild(o); });
const q = new URLSearchParams(location.search).get("list");   // opcional: music.html?list=ID
if (q) { PLAYLISTS.unshift({ name: "enlace", url: q }); const o = document.createElement("option"); o.value = 0; o.textContent = "enlace"; $("pl").prepend(o); $("pl").value = 0; }

let player = null, shuffle = false, loop = true, playing = false;
const vol0 = +safeGet("music-vol");
if (!isNaN(vol0) && safeGet("music-vol") !== null) $("vol").value = vol0;

const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("yt", {
    width: 200, height: 200,
    playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1 },
    events: { onReady, onStateChange, onError }
  });
};

function loadCurrent(autoplay){
  const id = listId(PLAYLISTS[+$("pl").value].url);
  $("status").textContent = "cargando playlist…";
  const opts = { list: id, listType: "playlist", index: 0 };
  autoplay ? player.loadPlaylist(opts) : player.cuePlaylist(opts);
  setTimeout(() => { try { player.setLoop(loop); player.setShuffle(shuffle); } catch(e){} }, 1200);
}
function onReady(){
  player.setVolume(+$("vol").value);
  loadCurrent(false);
  $("status").textContent = "pulsa PLAY";
  setInterval(tick, 500);
}
function onStateChange(e){
  const st = e.data;
  playing = (st === 1 || st === 3);
  $("play").textContent = playing ? "PAUSA" : "PLAY";
  if (st === 1) $("status").textContent = "sonando";
  if (st === 2) $("status").textContent = "en pausa";
  if (st === 5) $("status").textContent = "pulsa PLAY";
  tick();
}
function onError(e){
  const c = e.data;
  if (c === 101 || c === 150){ $("status").textContent = "esta canción no se puede incrustar, salto a la siguiente"; setTimeout(() => player.nextVideo(), 1200); }
  else if (c === 100){ $("status").textContent = "no encuentro el vídeo o la playlist es privada"; }
  else if (c === 2){ $("status").textContent = "enlace o ID de playlist no válido"; }
  else { $("status").textContent = "error de reproducción (" + c + ")"; }
}
function tick(){
  if (!player || !player.getCurrentTime) return;
  try {
    const d = player.getDuration(), t = player.getCurrentTime(), data = player.getVideoData();
    if (data && data.title) $("title").textContent = data.title;
    $("cur").textContent = fmt(t); $("dur").textContent = fmt(d);
    $("fill").style.width = d ? (t / d * 100) + "%" : "0%";
  } catch(e){}
}

$("play").onclick = () => { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); };
$("prev").onclick = () => player && player.previousVideo();
$("next").onclick = () => player && player.nextVideo();
$("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); if (player) player.setShuffle(shuffle); };
$("loop").onclick = () => { loop = !loop; $("loop").classList.toggle("on", loop); if (player) player.setLoop(loop); };
$("pl").onchange = () => player && loadCurrent(true);
$("vol").oninput = () => { if (player) player.setVolume(+$("vol").value); safeSet("music-vol", $("vol").value); };
$("seek").onclick = e => {
  if (!player) return;
  const r = $("seek").getBoundingClientRect();
  player.seekTo(player.getDuration() * ((e.clientX - r.left) / r.width), true);
};
</script>
</body>
</html>
