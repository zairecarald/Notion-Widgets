<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home · music</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== PALETTE (same as the other widgets) ====== */
  :root{--bg:#191919;--panel:#202020;--line:#3a3a38;--text:#e8e6df;--muted:#8d8b84;--bar:#c4c2ac;--accent:#529cca;--warn:#d4907c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{padding:12px 16px 18px}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:25px}
  .top h2{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}

  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  #ytwrap{width:200px;height:200px;border-radius:8px;overflow:hidden;background:#000;flex:none}
  .info{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
  select{background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px;font-weight:700;padding:5px 6px;cursor:pointer;width:100%}
  #title{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #status{font-size:11px;color:var(--muted)}
  #status:empty{display:none}
  .seekwrap{position:relative;padding-top:12px;cursor:pointer}
  .seek{position:relative;height:8px;border:1.5px solid var(--line);border-radius:5px;overflow:hidden}
  .seek i{display:block;height:100%;width:0;background:var(--bar)}
  .dim{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.6) 0 3px,rgba(0,0,0,.3) 3px 6px);display:none}
  .flag{--c:var(--accent);position:absolute;top:0;height:20px;width:0;border-left:2px solid var(--c);display:none;pointer-events:none}
  .flag::before{content:"";position:absolute;top:0;width:9px;height:7px;background:var(--c)}
  .flag.in::before{left:0;clip-path:polygon(0 0,100% 50%,0 100%)}
  .flag.out{--c:var(--warn)}
  .flag.out::before{left:-9px;clip-path:polygon(100% 0,0 50%,100% 100%)}
  .times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}

  /* 6-column grid: top row = 3 buttons of 2 columns, bottom row = 2 buttons of 3 columns (symmetric) */
  .ctrl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .ctrl button{font:inherit;font-size:12px;cursor:pointer;border-radius:6px;padding:7px 4px;background:transparent;color:var(--text);border:1px solid var(--line);grid-column:span 2}
  .ctrl button:hover{border-color:var(--muted)}
  .ctrl button.wide{grid-column:span 3}
  .lbl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:4px;cursor:pointer;user-select:none;padding:3px 0}
  .lbl:hover{color:var(--text)}
  .lbl .name{display:flex;align-items:center;gap:8px}
  .lbl .name::before{content:"";width:5px;height:5px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-1px,-1px);transition:transform .15s}
  .ctrl.ac-closed .lbl .name::before{transform:rotate(-45deg)}
  .ctrl.ac-closed #fin,.ctrl.ac-closed #fout,.ctrl.ac-closed #fclr{display:none}
  .lbl #trimInfo{color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
  .ctrl button.main{background:var(--text);color:var(--bg);border:0;font-weight:800}
  .ctrl button.on{color:var(--accent);border-color:var(--accent)}
  .vol{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);letter-spacing:1px}
  input[type=range]{flex:1;accent-color:var(--bar)}
</style>
</head>
<body>
<main>
  <div class="top"><h2>MUSIC</h2></div>
  <div class="card">
    <div id="ytwrap"><div id="yt"></div></div>
    <div class="info">
      <select id="pl"></select>
      <div id="title">&mdash;</div>
      <div id="status">loading&hellip;</div>
      <div class="seekwrap" id="seekwrap">
        <div class="seek" id="seek"><i id="fill"></i><b class="dim" id="dimL"></b><b class="dim" id="dimR"></b></div>
        <div class="flag in" id="flagIn"></div><div class="flag out" id="flagOut"></div>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="ctrl ac-closed" id="ctrl">
        <button id="prev" title="previous">&lt;&lt;</button>
        <button id="play" class="main">PLAY</button>
        <button id="next" title="next">&gt;&gt;</button>
        <button id="shuf" class="wide" title="shuffle">SHUF</button>
        <button id="loop" class="wide on" title="repeat playlist">LOOP</button>
        <div class="lbl" id="aclbl" title="show / hide the anticlaps flags"><span class="name">ANTICLAPS</span><span id="trimInfo"></span></div>
        <button id="fin" title="From now on this song will start here">FLAG IN</button>
        <button id="fout" title="From now on this song will stop here and jump to the next one">FLAG OUT</button>
        <button id="fclr" title="Remove both flags from this song">CLEAR</button>
      </div>
      <div class="vol"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="60"></div>
    </div>
  </div>
</main>

<script>
/* ====================================================================
   YOUR PLAYLISTS: paste the full YouTube / YouTube Music link here.
   The playlist must be public or "unlisted".
   Add more lines to get several playlists in the dropdown.
   ==================================================================== */
const PLAYLISTS = [
  { name: "playlist", url: "https://music.youtube.com/playlist?list=PLcyp8AN81_IA" }
];

/* ============================ CODE ============================ */
const $ = id => document.getElementById(id);
const listId = u => { const m = u.match(/[?&]list=([^&]+)/); return m ? m[1] : u.trim(); };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

PLAYLISTS.forEach((p, i) => { const o = document.createElement("option"); o.value = i; o.textContent = p.name; $("pl").appendChild(o); });
const q = new URLSearchParams(location.search).get("list");   // optional: music.html?list=ID
if (q) { PLAYLISTS.unshift({ name: "link", url: q }); const o = document.createElement("option"); o.value = 0; o.textContent = "link"; $("pl").prepend(o); $("pl").value = 0; }

let player = null, shuffle = false, loop = true, playing = false;

/* ANTICLAPS: per-song start/stop flags (saved in this browser, one pair per YouTube video) */
let trims = {};
try { trims = JSON.parse(safeGet("music-anticlaps")) || {}; } catch(e){}
const saveTrims = () => safeSet("music-anticlaps", JSON.stringify(trims));
let curVid = null, lastTime = 0, applyIn = false, flash = "", flashTimer = null;
const vol0 = safeGet("music-vol");
if (vol0 !== null && !isNaN(+vol0)) $("vol").value = +vol0;

const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("yt", {
    width: 200, height: 200,
    playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1 },
    events: { onReady, onStateChange, onError }
  });
};

function loadCurrent(autoplay){
  const id = listId(PLAYLISTS[+$("pl").value].url);
  $("status").textContent = "loading playlist…";
  const opts = { list: id, listType: "playlist", index: 0 };
  autoplay ? player.loadPlaylist(opts) : player.cuePlaylist(opts);
  setTimeout(() => { try { player.setLoop(loop); player.setShuffle(shuffle); } catch(e){} }, 1200);
}
function onReady(){
  player.setVolume(+$("vol").value);
  loadCurrent(false);
  $("status").textContent = "";
  setInterval(tick, 250);
}
function onStateChange(e){
  const st = e.data;
  playing = (st === 1 || st === 3);
  $("play").textContent = playing ? "PAUSE" : "PLAY";
  if (!flash){
    if (st === 1) $("status").textContent = "playing";
    if (st === 2) $("status").textContent = "paused";
    if (st === 5) $("status").textContent = "";
  }
  if (st === 0) applyIn = true;          // a song ended: the next start goes through the IN flag
  tick();
}
function onError(e){
  const c = e.data;
  if (c === 101 || c === 150){ $("status").textContent = "this track can't be embedded, skipping to the next one"; setTimeout(() => player.nextVideo(), 1200); }
  else if (c === 100){ $("status").textContent = "video not found or the playlist is private"; }
  else if (c === 2){ $("status").textContent = "invalid link or playlist ID"; }
  else { $("status").textContent = "playback error (" + c + ")"; }
}
function say(msg){
  flash = msg; clearTimeout(flashTimer);
  $("status").textContent = msg;
  flashTimer = setTimeout(() => { flash = ""; }, 2500);
}
function drawFlags(d){
  const tr = trims[curVid] || {};
  const pos = v => (d ? Math.max(0, Math.min(100, v / d * 100)) : 0) + "%";
  const fi = $("flagIn"), fo = $("flagOut"), dl = $("dimL"), dr = $("dimR");
  fi.style.display = tr.in != null && d ? "block" : "none"; if (tr.in != null) fi.style.left = pos(tr.in);
  fo.style.display = tr.out != null && d ? "block" : "none"; if (tr.out != null) fo.style.left = pos(tr.out);
  dl.style.display = tr.in != null && d ? "block" : "none"; dl.style.left = "0"; dl.style.width = tr.in != null ? pos(tr.in) : "0";
  dr.style.display = tr.out != null && d ? "block" : "none"; dr.style.right = "0"; dr.style.width = tr.out != null ? (100 - parseFloat(pos(tr.out))) + "%" : "0";
  $("trimInfo").textContent = tr.in != null || tr.out != null ? "IN " + (tr.in != null ? fmt(tr.in) : "-") + "  OUT " + (tr.out != null ? fmt(tr.out) : "-") : "";
}
function tick(){
  if (!player || !player.getCurrentTime) return;
  try {
    const d = player.getDuration(), t = player.getCurrentTime(), data = player.getVideoData();
    if (data && data.title) $("title").textContent = data.title;
    const vid = data && data.video_id;
    if (vid && vid !== curVid){ curVid = vid; applyIn = true; lastTime = 0; }
    const tr = trims[curVid];

    if (applyIn && playing){                        // song just started: honour the IN flag once
      applyIn = false;
      if (tr && tr.in != null && t < tr.in - 0.5){ player.seekTo(tr.in, true); lastTime = tr.in; drawFlags(d); return; }
    }
    // natural arrival at the OUT flag (a manual jump past it is left alone so you can move the flag)
    if (tr && tr.out != null && playing && lastTime < tr.out && t >= tr.out && t - lastTime < 1.5){
      applyIn = true; lastTime = 0; player.nextVideo(); return;
    }
    lastTime = t;

    $("cur").textContent = fmt(t); $("dur").textContent = fmt(d);
    $("fill").style.width = d ? (t / d * 100) + "%" : "0%";
    drawFlags(d);
  } catch(e){}
}

function flagNow(kind){
  if (!player || !curVid) return;
  const t = Math.round(player.getCurrentTime()), tr = trims[curVid] = trims[curVid] || {};
  if (kind === "in"){
    if (tr.out != null && t >= tr.out){ say("IN must come before OUT (" + fmt(tr.out) + ")"); return; }
    tr.in = t; say("IN flag set at " + fmt(t));
  } else {
    if (tr.in != null && t <= tr.in){ say("OUT must come after IN (" + fmt(tr.in) + ")"); return; }
    tr.out = t; say("OUT flag set at " + fmt(t));
  }
  saveTrims(); tick();
}
const acOpen = safeGet("music-anticlaps-open") === "1";
$("ctrl").classList.toggle("ac-closed", !acOpen);
$("aclbl").onclick = () => {
  const closed = $("ctrl").classList.toggle("ac-closed");
  safeSet("music-anticlaps-open", closed ? "0" : "1");
};
$("fin").onclick = () => flagNow("in");
$("fout").onclick = () => flagNow("out");
$("fclr").onclick = () => { if (!curVid || !trims[curVid]) return; delete trims[curVid]; saveTrims(); say("flags removed from this song"); tick(); };

$("play").onclick = () => { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); };
$("prev").onclick = () => player && player.previousVideo();
$("next").onclick = () => player && player.nextVideo();
$("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); if (player) player.setShuffle(shuffle); };
$("loop").onclick = () => { loop = !loop; $("loop").classList.toggle("on", loop); if (player) player.setLoop(loop); };
$("pl").onchange = () => player && loadCurrent(true);
$("vol").oninput = () => { if (player) player.setVolume(+$("vol").value); safeSet("music-vol", $("vol").value); };
$("seekwrap").onclick = e => {
  if (!player) return;
  const r = $("seek").getBoundingClientRect();
  player.seekTo(player.getDuration() * ((e.clientX - r.left) / r.width), true);
};
</script>
</body>
</html>
