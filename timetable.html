<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home · timetable</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== PALETTE (same as the other widgets) ====== */
  :root{--bg:#191919;--panel:#202020;--line:#3a3a38;--text:#e8e6df;--muted:#8d8b84;--bar:#c4c2ac;--accent:#529cca;--warn:#d4907c;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{padding:12px 16px 18px}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:25px}
  .top h2{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}
  .pill{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;font:inherit;font-size:10px;letter-spacing:1px;padding:4px 11px;cursor:pointer}
  .pill:hover{border-color:var(--muted)}
  .nav{display:flex;align-items:center;gap:6px}
  .nav .pill{padding:4px 9px}
  #wk{font-size:10px;letter-spacing:1.5px;color:var(--muted);min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
  .chk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text);cursor:pointer}
  .chk input{accent-color:var(--accent);width:14px;height:14px}

  /* form */
  .form{display:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;margin-bottom:12px;gap:10px;flex-direction:column}
  .form.open{display:flex}
  .form label{font-size:10px;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:5px}
  .form input[type=text],.form input[type=time],textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px;padding:7px 8px;outline:none;width:100%}
  .form input:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > div{flex:1;min-width:120px}
  .hintm{font-size:10px;color:var(--muted);margin-top:-4px}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .dbtn{width:38px;height:30px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
  .dbtn.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}
  .swatches{display:flex;gap:8px}
  .sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:var(--text)}
  .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--text);color:var(--bg);border:0;border-radius:5px;font:inherit;font-weight:800;font-size:12px;padding:7px 14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);font-weight:500;margin-left:auto}
  #msg{font-size:11px;color:var(--warn)}

  /* grid */
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .tt{display:grid;grid-template-columns:54px repeat(7,minmax(92px,1fr));min-width:760px}
  .dh{height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--line);border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .dh.corner{border-left:0}
  .dh b{font-size:12px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
  .dh.today{color:var(--text)}
  .dh.today b{color:var(--accent)}
  .tcol{position:relative}
  .tl{position:absolute;right:8px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
  .dcol{position:relative;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:cell}
  .dcol.today{background-color:color-mix(in srgb,var(--text) 3%,transparent)}
  .ev{--c:#8e8bf0;position:absolute;border-radius:6px;padding:3px 6px;font-size:11px;overflow:hidden;cursor:pointer;
      background:color-mix(in srgb,var(--c) 26%,var(--panel));border-left:3px solid var(--c);line-height:1.3}
  .ev:hover{background:color-mix(in srgb,var(--c) 36%,var(--panel))}
  .ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev span{display:block;font-size:10px;color:color-mix(in srgb,var(--text) 65%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ev.at{height:28px;padding:2px 6px}
  .ev.before,.ev.after{background:none;border:1px dashed color-mix(in srgb,var(--c) 70%,transparent);border-left:3px solid var(--c)}
  .ev.before{background:linear-gradient(to top,color-mix(in srgb,var(--c) 30%,var(--panel)),transparent)}
  .ev.after{background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 30%,var(--panel)),transparent)}
  .ev.before:hover,.ev.after:hover{border-color:var(--c)}
  .modes{display:flex;gap:6px;flex-wrap:wrap}
  .mbtn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:10px;letter-spacing:1px;cursor:pointer}
  .mbtn.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:800}
  .now{position:absolute;left:0;right:0;border-top:1.5px solid var(--warn);z-index:3;pointer-events:none}
  .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

  .foot{margin-top:14px}
  .backup{display:none;margin-top:10px;flex-direction:column;gap:8px}
  .backup.open{display:flex}
  .backup textarea{height:90px;resize:vertical;font-size:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 8px;outline:none;width:100%;font-family:inherit}
  .hint{font-size:10px;color:var(--muted)}
  #warn{display:none;font-size:10px;color:var(--warn);margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="top"><h2>TIMETABLE</h2>
    <div class="nav"><button class="pill" id="wprev" title="previous week">&lt;</button><span id="wk"></span><button class="pill" id="wnext" title="next week">&gt;</button><button class="pill" id="wnow" title="back to this week">TODAY</button></div>
    <button class="pill" id="new">+ NEW</button></div>

  <form class="form" id="form" autocomplete="off">
    <div><label>TITLE</label><input type="text" id="f-title" maxlength="40" placeholder="e.g. Work"></div>
    <div><label>DAYS</label><div class="days" id="f-days"></div></div>
    <div><label>TYPE</label><div class="modes" id="f-modes"></div></div>
    <div class="row">
      <div><label id="l-start">START</label><input type="time" id="f-start" step="300"></div>
      <div id="w-end"><label>END</label><input type="time" id="f-end" step="300"></div>
    </div>
    <label class="chk"><input type="checkbox" id="f-rep" checked> repeat every week (untick for this week only)</label>
    <div class="hintm" id="f-hint"></div>
    <div><label>COLOR</label><div class="swatches" id="f-sw"></div></div>
    <div class="btns">
      <button type="submit" class="btn" id="f-save">SAVE</button>
      <button type="button" class="btn ghost" id="f-cancel">CANCEL</button>
      <button type="button" class="btn danger" id="f-del" style="display:none">DELETE</button>
      <span id="msg"></span>
    </div>
  </form>

  <div class="scroll"><div class="tt" id="tt"></div></div>

  <div class="foot"><button class="pill" id="bk-toggle">BACKUP</button></div>
  <div class="backup" id="backup">
    <div class="hint">Copy this text and keep it wherever you like. To restore your timetable or move it to another browser, paste it here and press RESTORE.</div>
    <textarea id="bk-text" spellcheck="false"></textarea>
    <div class="btns"><button class="btn ghost" id="bk-restore">RESTORE</button><span class="hint" id="bk-msg"></span></div>
  </div>
  <div id="warn">this browser doesn't allow saving data here: your timetable will be lost on reload</div>
</main>

<script>
/* ===== CONFIG ===== */
const START_HOUR = 7;      // the grid always shows at least this range...
const END_HOUR   = 23;     // ...and grows by itself if an event falls outside it
const HOUR_H     = 40;     // pixels per hour
const COLORS = { violet:"#8e8bf0", amber:"#e0a35a", cyan:"#5cc4dc", green:"#7fbf8a", rose:"#d4907c", beige:"#c4c2ac" };
const STORE = "home-timetable";
const DAY_NAMES = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DAY_LETTERS = ["M","T","W","T","F","S","S"];

/* ===== utilities ===== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : NaN; };
const toStr = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.startsWith("on")) e[k] = props[k];
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => c && e.appendChild(c));
  return e;
}

/* ===== event types ===== */
const MODES = { range:"RANGE", at:"AT", before:"BEFORE", after:"AFTER" };
const MODE_HINT = {
  range: "Starts and ends at a set time.",
  at: "Only a time, no end. Good for a train or any plan with no fixed duration.",
  before: "Loose: do it any time before this hour. Shown as a soft band ending there.",
  after: "Loose: do it any time after this hour. Shown as a soft band starting there."
};
const modeOf = e => MODES[e.mode] ? e.mode : "range";
function spanOf(e){
  const s = toMin(e.start), m = modeOf(e);
  if (m === "range") return [s, toMin(e.end)];
  if (m === "at") return [s, Math.min(1440, s + 30)];
  if (m === "before") return [Math.max(0, s - 60), s];
  return [s, Math.min(1440, s + 60)];
}
const S = e => spanOf(e)[0], E = e => spanOf(e)[1];
function label(e){
  const m = modeOf(e);
  return m === "range" ? e.start + " - " + e.end : m === "at" ? e.start : m + " " + e.start;
}

/* ===== data ===== */
let events = [];
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE));
    if (d && Array.isArray(d.events)) events = d.events;
  } catch(e){}
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify({ v: 1, events })); }
  catch(e){ $("warn").style.display = "block"; }
}
function clean(list){
  return list.filter(e => e && Array.isArray(e.days) && !isNaN(toMin(e.start)) &&
      (modeOf(e) !== "range" || (!isNaN(toMin(e.end)) && toMin(e.end) > toMin(e.start))))
    .map(e => ({ id: e.id || uid(), title: String(e.title || "Event").slice(0, 40),
      days: [...new Set(e.days.map(Number).filter(d => d >= 0 && d <= 6))], start: e.start,
      mode: modeOf(e), end: modeOf(e) === "range" ? e.end : "",
      color: COLORS[e.color] ? e.color : "violet",
      week: /^\d{4}-\d{2}-\d{2}$/.test(e.week || "") ? e.week : null }));
}

/* ===== render ===== */
function range(){
  let a = START_HOUR, b = END_HOUR;
  events.forEach(e => { a = Math.min(a, Math.floor(S(e) / 60)); b = Math.max(b, Math.ceil(E(e) / 60)); });
  return [a, Math.min(24, b)];
}
/* side-by-side lanes for overlapping events of one day */
function layout(list){
  const sorted = [...list].sort((x, y) => S(x) - S(y) || E(y) - E(x));
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const lanesEnd = [];
    cluster.forEach(ev => {
      let l = lanesEnd.findIndex(end => end <= S(ev));
      if (l < 0){ l = lanesEnd.length; lanesEnd.push(0); }
      lanesEnd[l] = E(ev); ev._lane = l;
    });
    cluster.forEach(ev => out.push({ ev, lane: ev._lane, lanes: lanesEnd.length }));
    cluster = [];
  };
  sorted.forEach(ev => {
    if (S(ev) >= clusterEnd) flush();
    cluster.push(ev); clusterEnd = Math.max(clusterEnd < 0 || cluster.length === 1 ? 0 : clusterEnd, E(ev));
  });
  flush();
  return out;
}

let weekOffset = 0;
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const isoDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
function shownMonday(){
  const now = new Date(), idx = (now.getDay() + 6) % 7;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() - idx + weekOffset * 7);
}
function render(){
  const tt = $("tt"); tt.textContent = "";
  const [h0, h1] = range(), rows = h1 - h0, H = HOUR_H;
  const now = new Date(), todayIdx = weekOffset === 0 ? (now.getDay() + 6) % 7 : -1;
  const monday = shownMonday(), wkKey = isoDate(monday);
  const sun = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  $("wk").textContent = weekOffset === 0 ? "THIS WEEK" : weekOffset === 1 ? "NEXT WEEK" : weekOffset === -1 ? "LAST WEEK" :
    monday.getDate() + " " + MON[monday.getMonth()] + " - " + sun.getDate() + " " + MON[sun.getMonth()];
  $("wnow").style.visibility = weekOffset === 0 ? "hidden" : "visible";

  tt.appendChild(el("div", { class: "dh corner" }));
  for (let d = 0; d < 7; d++){
    const date = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + d);
    tt.appendChild(el("div", { class: "dh" + (d === todayIdx ? " today" : "") }, el("span", { text: DAY_NAMES[d] }), el("b", { text: String(date.getDate()) })));
  }

  const tcol = el("div", { class: "tcol" }); tcol.style.height = rows * H + "px";
  for (let i = 0; i < rows; i++){
    const l = el("div", { class: "tl", text: pad(h0 + i) + ":00" }); l.style.top = i * H + (i === 0 ? 8 : 0) + "px"; tcol.appendChild(l);
  }
  const endL = el("div", { class: "tl", text: pad(h1 % 24) + ":00" }); endL.style.top = rows * H - 8 + "px"; tcol.appendChild(endL);
  tt.appendChild(tcol);

  const lineBg = "repeating-linear-gradient(to bottom,transparent 0,transparent " + (H - 1) + "px,color-mix(in srgb,var(--line) 55%,transparent) " + (H - 1) + "px," +
                 "color-mix(in srgb,var(--line) 55%,transparent) " + H + "px)";
  for (let d = 0; d < 7; d++){
    const col = el("div", { class: "dcol" + (d === todayIdx ? " today" : "") });
    col.style.height = rows * H + "px"; col.style.backgroundImage = lineBg;
    col.onclick = e => {
      if (e.target !== col) return;
      const y = e.clientY - col.getBoundingClientRect().top;
      const hour = Math.min(h1 - 1, h0 + Math.floor(y / H));
      openForm(null, { days: [d], start: toStr(hour * 60), end: toStr(Math.min(24 * 60 - 5, (hour + 1) * 60)) });
    };
    layout(events.filter(e => e.days.includes(d) && (!e.week || e.week === wkKey))).forEach(({ ev, lane, lanes }) => {
      const top = (S(ev) - h0 * 60) / 60 * H, height = Math.max(18, (E(ev) - S(ev)) / 60 * H - 2);
      const b = el("div", { class: "ev " + modeOf(ev), title: (ev.week ? "this week only · " : "") + ev.title + " " + label(ev), onclick: x => { x.stopPropagation(); openForm(ev); } },
        el("b", { text: (ev.week ? "· " : "") + ev.title }), el("span", { text: label(ev) }));
      b.style.setProperty("--c", COLORS[ev.color]);
      b.style.top = top + 1 + "px"; if (modeOf(ev) !== "at") b.style.height = height + "px";
      b.style.left = "calc(" + (lane / lanes * 100) + "% + 2px)"; b.style.width = "calc(" + (100 / lanes) + "% - 4px)";
      col.appendChild(b);
    });
    if (d === todayIdx){
      const m = now.getHours() * 60 + now.getMinutes();
      if (m >= h0 * 60 && m <= h1 * 60){ const nl = el("div", { class: "now" }); nl.style.top = (m - h0 * 60) / 60 * H + "px"; col.appendChild(nl); }
    }
    tt.appendChild(col);
  }
}

/* ===== form ===== */
let editingId = null, fDays = new Set(), fColor = "violet", fMode = "range";
function drawDays(){
  const box = $("f-days"); box.textContent = "";
  DAY_LETTERS.forEach((l, i) => box.appendChild(el("button", { type: "button", class: "dbtn" + (fDays.has(i) ? " on" : ""), title: DAY_NAMES[i], text: l,
    onclick: () => { fDays.has(i) ? fDays.delete(i) : fDays.add(i); drawDays(); } })));
}
function drawModes(){
  const box = $("f-modes"); box.textContent = "";
  Object.keys(MODES).forEach(k => box.appendChild(el("button", { type: "button", class: "mbtn" + (k === fMode ? " on" : ""), text: MODES[k],
    onclick: () => { fMode = k; drawModes(); } })));
  $("w-end").style.display = fMode === "range" ? "" : "none";
  $("l-start").textContent = fMode === "range" ? "START" : "TIME";
  $("f-hint").textContent = MODE_HINT[fMode];
}
function drawSwatches(){
  const box = $("f-sw"); box.textContent = "";
  Object.keys(COLORS).forEach(n => {
    const b = el("button", { type: "button", class: "sw" + (n === fColor ? " on" : ""), title: n, onclick: () => { fColor = n; drawSwatches(); } });
    b.style.background = COLORS[n]; box.appendChild(b);
  });
}
function openForm(ev, pre){
  editingId = ev ? ev.id : null;
  const src = ev || pre || { days: [], start: "09:00", end: "10:00" };
  $("f-title").value = ev ? ev.title : "";
  fDays = new Set(src.days); fColor = ev ? ev.color : fColor;
  $("f-start").value = src.start; $("f-end").value = src.end || "10:00";
  fMode = ev ? modeOf(ev) : "range"; drawModes();
  $("f-rep").checked = ev ? !ev.week : true;
  $("f-save").textContent = ev ? "UPDATE" : "SAVE";
  $("f-del").style.display = ev ? "" : "none"; $("f-del").textContent = "DELETE";
  $("msg").textContent = "";
  drawDays(); drawSwatches();
  $("form").classList.add("open"); $("f-title").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeForm(){ $("form").classList.remove("open"); editingId = null; }
$("wprev").onclick = () => { weekOffset--; render(); };
$("wnext").onclick = () => { weekOffset++; render(); };
$("wnow").onclick = () => { weekOffset = 0; render(); };
$("new").onclick = () => $("form").classList.contains("open") ? closeForm() : openForm(null);
$("f-cancel").onclick = closeForm;
$("form").addEventListener("keydown", e => { if (e.key === "Escape") closeForm(); });
let confirmDel = false;
$("f-del").onclick = () => {
  if (!confirmDel){ confirmDel = true; $("f-del").textContent = "SURE? CLICK AGAIN"; return; }
  confirmDel = false; events = events.filter(e => e.id !== editingId); save(); closeForm(); render();
};
$("form").onsubmit = e => {
  e.preventDefault();
  const title = $("f-title").value.trim(), s = toMin($("f-start").value), en = toMin($("f-end").value);
  if (!title){ $("msg").textContent = "add a title"; $("f-title").focus(); return; }
  if (!fDays.size){ $("msg").textContent = "pick at least one day"; return; }
  if (isNaN(s)){ $("msg").textContent = "pick a time"; return; }
  if (fMode === "range" && (isNaN(en) || en <= s)){ $("msg").textContent = "the end must be after the start (an event can't cross midnight: split it in two)"; return; }
  const data = { title, days: [...fDays].sort(), start: toStr(s), end: fMode === "range" ? toStr(en) : "", mode: fMode, color: fColor };
  const old = editingId && events.find(x => x.id === editingId);
  data.week = $("f-rep").checked ? null : (old && old.week) || isoDate(shownMonday());
  if (editingId) Object.assign(old, data);
  else events.push({ id: uid(), ...data });
  save(); closeForm(); render();
};

/* ===== backup ===== */
$("bk-toggle").onclick = () => {
  const b = $("backup"), open = !b.classList.contains("open");
  b.classList.toggle("open", open);
  if (open){ $("bk-text").value = JSON.stringify({ v: 1, events }); $("bk-msg").textContent = ""; }
};
$("bk-restore").onclick = () => {
  try {
    const d = JSON.parse($("bk-text").value);
    if (!d || !Array.isArray(d.events)) throw new Error("format");
    events = clean(d.events); save(); render(); $("bk-msg").textContent = "restored";
  } catch(e){ $("bk-msg").textContent = "invalid text, nothing was changed"; }
};

/* ===== startup ===== */
load(); events = clean(events); render();
setInterval(render, 60000);   // moves the "now" line
window.addEventListener("storage", e => { if (e.key === STORE){ load(); render(); } });
</script>
</body>
</html>
